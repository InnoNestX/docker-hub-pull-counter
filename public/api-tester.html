<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to Signal Bridge…</title>
<meta http-equiv="refresh" content="0;url=./index.html#signal=user-stats">
<script>
(function(){
  var hash=location.hash||'';
  var signal='user-stats';
  var match=hash.match(/signal=([a-z0-9-]+)/i);
  if(match)signal=match[1];
  var params=new URLSearchParams(location.search);
  if(params.get('signal'))signal=params.get('signal');
  location.replace('./index.html#signal='+encodeURIComponent(signal));
})();
</script>
</head>
<body style="font-family:system-ui;background:#070b12;color:#3de7c9;padding:40px;text-align:center">
  <p>Signal Bridge online. Redirecting…</p>
  <p><a href="./index.html#signal=user-stats" style="color:#f0b429">Open console</a></p>
</body>
</html>
